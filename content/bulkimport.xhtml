<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="folder-import-options-window"
  title="Import files from folder"
  width="520"
  onload="onLoad(); sizeToContent();"
>
  <script src="chrome://zotero/content/include.js"></script>
  <script src="chrome://zotero-folder-import/content/bulkimport.js"></script>
  <dialog id="folder-import-options-dialog" buttons="accept,cancel"
    buttonlabelaccept="Import" buttonlabelcancel="Cancel">
  <html:div style="padding: 16px 20px 12px; min-width: 450px; color: var(--fill-primary, inherit); font: menu;">
    <html:div style="font-size: 16px; font-weight: 650; margin-bottom: 4px;">Import folder</html:div>
    <html:div style="font-size: 12px; color: var(--fill-secondary, #747474); margin-bottom: 16px;">
      Choose which files to add to the selected Zotero collection.
    </html:div>

    <html:div style="font-weight: 600; margin-bottom: 8px;">File types</html:div>
    <html:div
      id="folder-import-extensions"
      style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; padding: 12px; max-height: 160px; overflow-y: auto; border: 1px solid var(--fill-quaternary, #c5c5c5); border-radius: 7px;"
    ></html:div>

    <html:label for="folder-import-include-subfolders"
      style="display: flex; align-items: center; gap: 9px; margin: 16px 0; cursor: pointer;">
      <html:input id="folder-import-include-subfolders" type="checkbox" />
      <html:span>Include subfolders</html:span>
    </html:label>

    <html:div style="border-top: 1px solid var(--fill-quaternary, #c5c5c5); padding-top: 14px;">
      <html:div style="font-weight: 600; margin-bottom: 10px;">How to add files</html:div>
      <html:label for="folder-import-copy"
        style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px; cursor: pointer;">
        <html:input id="folder-import-copy" type="radio" name="folder-import-mode" value="copy" />
        <html:span>Store a copy in Zotero</html:span>
      </html:label>
      <html:label for="folder-import-link"
        style="display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <html:input id="folder-import-link" type="radio" name="folder-import-mode" value="link" />
        <html:span>Link to original files</html:span>
      </html:label>
    </html:div>
    <html:div
      id="folder-import-error"
      hidden="hidden"
      role="alert"
      style="margin-top: 12px; font-size: 12px; color: #b34141;"
    >Select at least one file type to continue.</html:div>
  </html:div>
  </dialog>
</window>
